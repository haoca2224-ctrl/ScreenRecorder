[package]
name = "screen-recorder"
version = "0.6.0"
edition = "2021"
license = "MIT"
description = "Trình quay màn hình Windows bằng Rust"

[dependencies]
anyhow = "1"
chrono = "0.4"
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
windows-capture = "=1.5.0"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Performance", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[build-dependencies]
winres = "0.1"

